name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: toma la de `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # El binario de Electron no va en el store de pnpm. Desde Electron 42 no se descarga al
      # instalar sino la primera vez que algo hace `import "electron"` (totem-window.test.ts):
      # esta caché evita bajarlo en cada ejecución.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integracion:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No bloquea hasta que lleve 10 ejecuciones verdes seguidas (plan, tarea 0.2).
    continue-on-error: true
    # `packages: read`: el token del job descarga las imágenes de ghcr.io (ver `env`).
    permissions:
      contents: read
      packages: read
    # El registro por defecto del CLI (public.ecr.aws) corta las descargas anónimas por volumen;
    # ghcr.io, su respaldo, admite las del token del job, con más margen.
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      # Lo que la integración no usa: panel, funciones, transformación de imágenes, analítica y
      # pooler. NO excluir `postgres-meta` (`supabase gen types`, db-types-sync.test.ts) ni
      # `mailpit` (Auth manda la invitación del alta de cliente, platform-tenants.test.ts).
      # Nombres de contenedor del CLI 2.109.1 (los da su aviso).
      EXCLUIR: studio,edge-runtime,imgproxy,vector,logflare,supavisor
    # La integración no importa Electron, así que no descarga su binario (desde Electron 42 solo
    # se baja al usarlo; `ELECTRON_SKIP_BINARY_DOWNLOAD` ya no existe).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # La misma versión de CLI que en local: fija las imágenes del stack.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Las imágenes del stack, en caché: el registro público de Supabase corta las descargas
      # anónimas por volumen («toomanyrequests: Data limit exceeded») y tumbaba el job antes del
      # primer test. Se descargan una vez por versión del CLI y config; el CLI no vuelve a bajar
      # una imagen que ya está en el Docker local.
      - id: imagenes
        uses: actions/cache/restore@v4
        with:
          path: /tmp/imagenes-supabase.tar
          key: imagenes-supabase-ghcr-2.109.1-${{ hashFiles('supabase/config.toml') }}-${{ env.EXCLUIR }}
      - if: steps.imagenes.outputs.cache-hit == 'true'
        run: docker load -i /tmp/imagenes-supabase.tar
      - if: steps.imagenes.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # La lista va en la clave de la caché: si cambia, la caché vieja no tendría las imágenes nuevas.
      - run: supabase start -x "$EXCLUIR"

      # Se guarda en cuanto el stack arranca, no al final: así la caché se rellena aunque luego
      # falle un test.
      - if: steps.imagenes.outputs.cache-hit != 'true'
        run: docker save $(docker ps --format '{{.Image}}' | sort -u) -o /tmp/imagenes-supabase.tar
      - if: steps.imagenes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/imagenes-supabase.tar
          key: ${{ steps.imagenes.outputs.cache-primary-key }}

      - run: pnpm db:env
      - run: pnpm seed:staff
      - run: pnpm test:integration

      # Si falla, los logs del stack (Kong, Auth, Realtime…) separan "entorno" de "código".
      - if: failure()
        run: |
          mkdir -p test-results
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            docker logs "$c" > "test-results/$c.log" 2>&1
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-logs
          path: test-results/

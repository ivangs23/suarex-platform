name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: toma la de `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # El binario de Electron no va en el store de pnpm. Desde Electron 42 no se descarga al
      # instalar sino la primera vez que algo hace `import "electron"` (totem-window.test.ts):
      # esta caché evita bajarlo en cada ejecución.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integracion:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No bloquea hasta que lleve 10 ejecuciones verdes seguidas (plan, tarea 0.2).
    continue-on-error: true
    # La integración no importa Electron, así que no descarga su binario (desde Electron 42 solo
    # se baja al usarlo; `ELECTRON_SKIP_BINARY_DOWNLOAD` ya no existe).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # La misma versión de CLI que en local: fija las imágenes del stack.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # Sin lo que la integración no usa (panel, correo, funciones, imágenes, analítica): son
      # siete imágenes menos por ejecución, y el límite de descargas del registro ya tumbó la CI.
      - run: supabase start -x studio,meta,inbucket,edge-runtime,imgproxy,vector,analytics
      - run: pnpm db:env
      - run: pnpm seed:staff
      - run: pnpm test:integration

      # Si falla, los logs del stack (Kong, Auth, Realtime…) separan "entorno" de "código".
      - if: failure()
        run: |
          mkdir -p test-results
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            docker logs "$c" > "test-results/$c.log" 2>&1
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-logs
          path: test-results/
